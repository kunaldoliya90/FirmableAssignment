# firmable FastAPI application package
[project]
name = "firmable"
version = "0.1.0"
description = "FirmableAssignment FastAPI application (modular monolith)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "orggraph-dataset",
    "orggraph-inference",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.scripts]
firmable-api = "firmable.main:run"

[tool.uv.sources]
orggraph-dataset = { workspace = true }
orggraph-inference = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firmable"]

[tool.pytest.ini_options]
testpaths = ["src/firmable/tests"]
addopts = "-ra --import-mode=importlib"
