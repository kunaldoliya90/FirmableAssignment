# uv workspace root; also ships the Infra package
[project]
name = "firmable-backend"
version = "0.1.0"
description = "FirmableAssignment backend: dataset generation, org-chart inference and the FastAPI application"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "orggraph-dataset",
    "orggraph-inference",
    "firmable",
    "pydantic-settings>=2.4",
]

[tool.uv.workspace]
members = ["DataGenerator", "Inference", "Application"]

[tool.uv.sources]
orggraph-dataset = { workspace = true }
orggraph-inference = { workspace = true }
firmable = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = ["Inference/src", "Application/src", "DataGenerator/src", "."]

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true
