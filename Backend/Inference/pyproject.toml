# orggraph-inference package
[project]
name = "orggraph-inference"
version = "0.1.0"
description = "Org-chart inference: infer reporting lines from observed employee records"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "orggraph-dataset",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
orggraph-infer = "orggraph_inference.cli:app"

[tool.uv.sources]
orggraph-dataset = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orggraph_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
