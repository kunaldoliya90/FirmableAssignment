# Render Blueprint for the backend API (Blueprint path: Backend/Infra/Production/render.yaml; paths below are
# relative to the repository root). The frontend deploys to Vercel; see README, "Deploying".
services:
  - type: web
    name: firmable-api
    runtime: docker
    # free: 512 MB RAM (the app peaks near 200 MB), sleeps after ~15 min idle, no disk. The seeded results are
    # rebuilt into every image, so only runs started at runtime are lost on a redeploy or restart.
    # To keep those too: plan: starter and uncomment the disk below.
    plan: free
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Infra/Production/DockerfileProd
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: FIRMABLE_ENV
        value: production
      - key: FIRMABLE_CORS_ORIGINS
        sync: false
      - key: FIRMABLE_CORS_ORIGIN_REGEX
        sync: false
      - key: FIRMABLE_JOB_WORKERS
        value: "1"
      - key: FIRMABLE_INFERENCE__COMPANY_CACHE_SIZE
        value: "24"