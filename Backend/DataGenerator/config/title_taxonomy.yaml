    director: {title: Director of Engineering, variants: [Dir Engineering, Engineering Director, "Director, Engineering", Dir. of Engg]}
    senior_director: {title: Senior Director of Engineering, variants: ["Sr Director, Engineering", Sr. Dir Engineering, Senior Engineering Director]}
    vp: {title: VP Engineering, variants: [VP - Engineering, "Vice President, Engineering", VP of Engineering, VP Engg]}
    svp: {title: SVP Engineering, variants: [SVP - Engineering, "Senior Vice President, Engineering", Sr. VP Engineering]}
