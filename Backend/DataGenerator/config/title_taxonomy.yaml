# Title taxonomy: ladder patterns, per-family overrides and variant patterns
seniority_levels:
  - {key: intern, label: Intern, tier: 8, management: false, executive: false}
  - {key: junior, label: Junior, tier: 8, management: false, executive: false}
  - {key: ic, label: Individual Contributor, tier: 8, management: false, executive: false}
  - {key: senior_ic, label: Senior Individual Contributor, tier: 8, management: false, executive: false}
  - {key: staff, label: Staff, tier: 8, management: false, executive: false}
  - {key: principal, label: Principal, tier: 8, management: false, executive: false}
  - {key: manager, label: Manager, tier: 7, management: true, executive: false}
  - {key: senior_manager, label: Senior Manager, tier: 6, management: true, executive: false}
  - {key: director, label: Director, tier: 5, management: true, executive: false}
  - {key: senior_director, label: Senior Director, tier: 4, management: true, executive: false}
  - {key: vp, label: Vice President, tier: 3, management: true, executive: true}
  - {key: svp, label: Senior Vice President, tier: 2, management: true, executive: true}
  - {key: executive, label: Executive, tier: 1, management: true, executive: true}
  - {key: c_level, label: C-level, tier: 0, management: true, executive: true}

ladder_patterns:
  intern: "{function} Intern"
  junior: "Junior {ic_role}"
  ic: "{ic_role}"
  senior_ic: "Senior {ic_role}"
  staff: "Staff {ic_role}"
  principal: "Principal {ic_role}"
  manager: "{function} Manager"
  senior_manager: "Senior {function} Manager"
  director: "Director of {function}"
  senior_director: "Senior Director of {function}"
  vp: "VP {function}"
  svp: "SVP {function}"

variant_patterns:
  intern: ["{function} Intern", "Intern - {function}", "{function_abbrev} Intern", "Intern, {function}", "Summer Intern"]
  junior: ["Jr {ic_role}", "Jr. {ic_role}", "Associate {ic_role}", "{ic_role} I", "Junior {ic_abbrev}", "Jr. {ic_abbrev}"]
  ic: ["{ic_abbrev}", "{ic_role} II", "{ic_role} (Mid-level)"]
  senior_ic: ["Sr {ic_role}", "Sr. {ic_role}", "Senior {ic_abbrev}", "Sr. {ic_abbrev}", "Sr {ic_abbrev}", "{ic_role} III", "{ic_role}, Senior"]
  staff: ["Staff {ic_abbrev}", "Lead {ic_role}", "{ic_role} IV", "Lead {ic_abbrev}"]
  principal: ["Principal {ic_abbrev}", "Princ. {ic_role}", "{ic_role} V", "Principal {ic_role} (IC)"]
  manager: ["{function_abbrev} Mgr", "{function} Mgr", "Manager, {function}", "Manager - {function}", "Mgr {function}", "{function_abbrev} Manager"]
  senior_manager: ["Sr Mgr - {function_abbrev}", "Sr. {function} Manager", "Senior Manager, {function}", "Sr Manager {function}", "Sr. Mgr, {function}"]
  director: ["Dir {function}", "Director, {function}", "{function} Director", "Dir. of {function}", "Director - {function_abbrev}", "{function_abbrev} Director"]
  senior_director: ["Sr Director, {function}", "Sr. Dir {function}", "Senior Director, {function}", "Sr Dir - {function_abbrev}"]
  vp: ["VP - {function}", "Vice President, {function}", "VP of {function}", "Vice President of {function}", "VP {function_abbrev}"]
  svp: ["SVP - {function}", "Senior Vice President, {function}", "Sr. VP {function}", "SVP {function_abbrev}"]

