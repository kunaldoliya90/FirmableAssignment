# Regions and office cities; the cities are real, the companies are not
regions:
  north_america:
    name: North America
    aliases: [NA, NAM, AMER, N. America]
    faker_locales: [en_US, en_US, en_US, en_CA]
  emea:
    name: EMEA
    aliases: [Europe, EU, Europe & Middle East, EMEA Region]
    faker_locales: [en_GB, de_DE, fr_FR, es_ES, nl_NL, it_IT]
  apac:
    name: APAC
    aliases: [Asia Pacific, Asia-Pacific, AsiaPac, APJ]
    faker_locales: [en_IN, en_IN, en_AU, en_NZ]
  latam:
    name: LATAM
    aliases: [Latin America, LatAm, South America, LAC]
    faker_locales: [es_MX, pt_BR, es_ES]

